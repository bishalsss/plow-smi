[package]
name = "plows-top"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
description = "Professional terminal GPU & system monitor — like htop for GPUs"

[dependencies]
# Use the exporter library for GPU + system data collection (plows-gpu backed)
plows-exporter = { path = "../plows-exporter", default-features = true, features = ["gpu", "system"] }

# Process info type from unified GPU crate
plows-gpu = { path = "../plows-gpu" }

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Async runtime (needed to call async collectors)
tokio = { version = "1", features = ["rt", "macros"] }

# System info (per-core CPU, etc.)
sysinfo = { workspace = true }

# Color support
color-eyre = "0.6"

# Time formatting
chrono = "0.4"

[[bin]]
name = "plows-top"
path = "src/main.rs"

[lib]
name = "plows_top"
path = "src/lib.rs"
