[package]
name = "is-ctl"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "GPU power & clock control library & CLI — backed by is-gpu (NVML / AMD SMI)"

[dependencies]
clap = { version = "4", features = ["derive"] }
is-gpu = { path = "../is-gpu" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "is-ctl"
path = "src/main.rs"

[lib]
name = "is_ctl"
path = "src/lib.rs"
