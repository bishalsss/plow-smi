[package]
name = "is-exporter"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Professional GPU metrics exporter for Prometheus (AMD, NVIDIA, Intel, TPU, System)"

[features]
default = ["gpu", "system"]
# Unified runtime GPU backends via is-gpu (NVML / AMD SMI / Level Zero).
gpu = []
# Legacy aliases kept so existing `--features nvidia/amd` command lines keep working.
nvidia = ["gpu"]
amd = ["gpu"]
system = ["dep:sysinfo"]
tpu = ["dep:reqwest"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# Web framework for Prometheus endpoint
axum = "0.8"

# Metrics
prometheus = "0.14"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Async trait support
async-trait = "0.1"

# Lazy statics
once_cell = "1"

# Hostname detection
whoami = "1"

# Unified GPU metrics (dlopen NVML / AMD SMI / Level Zero)
is-gpu = { path = "../is-gpu" }

# Optional: System metrics
sysinfo = { version = "0.36", optional = true }

# Optional: TPU support (HTTP client for GCE metadata + TPU runtime)
reqwest = { version = "0.12", features = ["json"], optional = true }

[[bin]]
name = "is-exporter"
path = "src/main.rs"
