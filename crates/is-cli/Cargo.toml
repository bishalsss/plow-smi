[package]
name = "is-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
description = "Unified InferSight CLI — export, monitor, and control GPUs from one binary"

[dependencies]
is-exporter = { path = "../is-exporter", default-features = true, features = ["gpu", "system"] }
is-ctl = { path = "../is-ctl" }
is-top = { path = "../is-top" }

clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
colored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"

[[bin]]
name = "infersight"
path = "src/main.rs"
